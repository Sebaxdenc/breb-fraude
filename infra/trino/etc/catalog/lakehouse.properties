# Catálogo "lakehouse": tablas Delta de los tres buckets, registradas en el Hive Metastore.
# Consulta: SELECT ... FROM lakehouse.<esquema>.<tabla>
connector.name=delta_lake
hive.metastore.uri=thrift://hive-metastore:9083
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
# Spark escribe las tablas; Trino solo las registra (CALL lakehouse.system.register_table) y las lee.
delta.register-table-procedure.enabled=true
