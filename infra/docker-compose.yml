# Stack local de Bre-B (Entregable 2, fase 2). Instrucciones en README.md, sección "Levantar el stack".
#   Perfil dev (infra/.env, por defecto):  docker compose up -d --build
#   Perfil completo:                       docker compose --env-file completo.env up -d --build
# Todos los puertos se publican solo en 127.0.0.1.
name: breb

x-kafka: &kafka
  image: apache/kafka:4.3.2
  restart: unless-stopped
  healthcheck:
    # El chequeo arranca una JVM: con poca memoria para no competir con el bróker dentro del límite.
    test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    # Cada chequeo arranca una JVM dentro del límite de 1 CPU del bróker. Cada 5 s mientras arranca
    # y cada 60 s después, para no quitarle CPU al bróker durante las mediciones de latencia.
    interval: 60s
    start_interval: 5s
    start_period: 90s
    timeout: 15s
    retries: 5
  deploy:
    resources:
      # 2 CPU: con 1, el bróker se saturó mientras los jobs leían el tópico (p99 fuente → Kafka de 4,9 s)
      limits: {cpus: "2.0", memory: 768m}

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_VOTANTES}
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNO:PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_RF}
  KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_ISR}
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_RF}
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_RF}
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_MIN_ISR}
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: ${KAFKA_RF}
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: ${KAFKA_MIN_ISR}
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m

x-mongo: &mongo
  image: mongo:7.0.45
  restart: unless-stopped
  command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/llave/keyfile",
            "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB}"]
  depends_on:
    mongo-llave: {condition: service_completed_successfully}
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 20s
  deploy:
    resources:
      limits: {cpus: "2.0", memory: "${MONGO_LIMITE}"}

# Cinco servicios usan la imagen breb-spark:local, pero solo spark-master la construye: si varios servicios
# tienen el mismo build e image, Compose (bake) los construye en paralelo y falla con "image already exists".
# pull_policy: never evita que Compose intente descargar esa imagen de Docker Hub, donde no existe.
x-spark: &spark
  image: breb-spark:local
  pull_policy: never
  restart: unless-stopped
  env_file: [credenciales/s3.env]

x-spark-env: &spark-env
  SPARK_DAEMON_MEMORY: 256m
  S3_ENDPOINT: http://seaweedfs:8333
  DYNAMODB_ENDPOINT: http://dynamodb-local:8000

x-job: &job
  image: breb-spark:local
  pull_policy: never
  profiles: [streaming]
  restart: unless-stopped
  env_file: [credenciales/s3.env, credenciales/mongo-app.env]
  environment:
    <<: *spark-env
    KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
    MONGO_MIEMBROS: ${MONGO_MIEMBROS}
    SNS_ENDPOINT: http://moto:5000
  volumes: [checkpoints:/checkpoints]
  depends_on:
    spark-master: {condition: service_started}
    init-recursos: {condition: service_completed_successfully}
    kafka-init: {condition: service_completed_successfully}

services:
  # ---------------------------------------------------------------- Kafka (KRaft)
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNO://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNO://localhost:29092
    ports: ["127.0.0.1:29092:29092"]
    volumes: [kafka-1-datos:/var/lib/kafka/data]

  kafka-2:
    <<: *kafka
    profiles: [completo]
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNO://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNO://localhost:29093
    ports: ["127.0.0.1:29093:29093"]
    volumes: [kafka-2-datos:/var/lib/kafka/data]

  kafka-3:
    <<: *kafka
    profiles: [completo]
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNO://:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNO://localhost:29094
    ports: ["127.0.0.1:29094:29094"]
    volumes: [kafka-3-datos:/var/lib/kafka/data]

  kafka-init:
    image: apache/kafka:4.3.2
    restart: "no"
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy, required: false}
      kafka-3: {condition: service_healthy, required: false}
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9092
      KAFKA_RF: ${KAFKA_RF}
      KAFKA_MIN_ISR: ${KAFKA_MIN_ISR}
      KAFKA_HEAP_OPTS: -Xmx128m
    volumes: ["./kafka/crear_topicos.sh:/scripts/crear_topicos.sh:ro"]
    # tr quita CRLF por si el repositorio se clonó en Windows sin .gitattributes.
    command: ["sh", "-c", "tr -d '\\r' < /scripts/crear_topicos.sh | sh"]

  # ---------------------------------------------------------------- Lakehouse: S3 local y commits de Delta
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    # El entrypoint agrega -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024.
    # AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY crean la única identidad con permisos sobre S3.
    command: ["server", "-s3", "-s3.port=8333", "-ip=seaweedfs", "-ip.bind=0.0.0.0"]
    env_file: [credenciales/s3.env]
    # Cada bucket es una colección y SeaweedFS le reserva 7 volúmenes al crearla: con los tres buckets
    # y poco disco libre se queda sin volúmenes ("No writable volumes"). Con 1 crece solo cuando se llena.
    environment:
      WEED_MASTER_VOLUME_GROWTH_COPY_1: "1"
    ports: ["127.0.0.1:8333:8333"]
    volumes: [seaweedfs-datos:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512m}

  dynamodb-local:
    image: amazon/dynamodb-local:3.3.2
    restart: unless-stopped
    # -sharedDb: una sola base para cualquier credencial y región. En memoria: si se reinicia, Delta
    # sigue funcionando porque los commits ya escritos están en S3 (la tabla solo coordina los nuevos).
    command: ["-Xmx256m", "-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["127.0.0.1:8000:8000"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512m}

  init-recursos:
    <<: *spark
    restart: "no"
    depends_on:
      seaweedfs: {condition: service_healthy}
      dynamodb-local: {condition: service_started}
      moto: {condition: service_started}
    environment:
      <<: *spark-env
      SNS_ENDPOINT: http://moto:5000
    command: ["python", "/opt/breb/infra/init/crear_recursos.py"]

  # ---------------------------------------------------------------- Spark standalone
  spark-master:
    <<: *spark
    build:
      context: ..
      dockerfile: infra/spark/Dockerfile
    hostname: spark-master
    environment: *spark-env
    command: ["spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports: ["127.0.0.1:8080:8080"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512m}

  spark-worker-1:
    <<: *spark
    hostname: spark-worker-1
    depends_on: [spark-master]
    environment: &spark-worker-env
      <<: *spark-env
      SPARK_WORKER_OPTS: -Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.appDataTtl=3600
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES}", "--memory", "${SPARK_WORKER_MEMORY}",
              "--webui-port", "8081", "--work-dir", "/opt/spark/work"]
    ports: ["127.0.0.1:8081:8081"]
    volumes: [checkpoints:/checkpoints]
    deploy:
      resources:
        limits: {cpus: "${SPARK_WORKER_CORES}", memory: "${SPARK_WORKER_LIMITE}"}

  spark-worker-2:
    <<: *spark
    profiles: [completo]
    hostname: spark-worker-2
    depends_on: [spark-master]
    environment: *spark-worker-env
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES}", "--memory", "${SPARK_WORKER_MEMORY}",
              "--webui-port", "8081", "--work-dir", "/opt/spark/work"]
    ports: ["127.0.0.1:8082:8081"]
    volumes: [checkpoints:/checkpoints]
    deploy:
      resources:
        limits: {cpus: "${SPARK_WORKER_CORES}", memory: "${SPARK_WORKER_LIMITE}"}

  # Contenedor de herramientas: docker compose run --rm spark-cliente <comando>
  spark-cliente:
    <<: *spark
    profiles: [herramientas]
    restart: "no"
    # `docker compose run` levanta estos servicios si están apagados
    depends_on: &infra-base
      seaweedfs: {condition: service_healthy}
      dynamodb-local: {condition: service_started}
      moto: {condition: service_started}
      kafka-1: {condition: service_healthy}
      mongo-1: {condition: service_healthy}
    env_file: [credenciales/s3.env, credenciales/mongo-app.env]
    environment:
      <<: *spark-env
      SPARK_MASTER_URL: spark://spark-master:7077
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      TRINO_URL: http://trino:8080
      METABASE_URL: http://metabase:3000
      MONGO_MIEMBROS: ${MONGO_MIEMBROS}
      SNS_ENDPOINT: http://moto:5000
    # datos/ para el estado inicial y el tramo de la demo (python -m breb.estado {tramo|cargar})
    volumes: ["../datos:/datos"]
    command: ["bash"]

  # Consumidores de alertas (RF15): docker compose run --rm entidad {--tramo | --entidades 20,12 | --analistas}
  entidad:
    <<: *spark
    profiles: [herramientas]
    restart: "no"
    env_file: [credenciales/s3.env, credenciales/mongo-app.env]
    environment:
      SNS_ENDPOINT: http://moto:5000
      MONGO_MIEMBROS: ${MONGO_MIEMBROS}
    depends_on:
      moto: {condition: service_started}
      mongo-1: {condition: service_healthy}
    entrypoint: ["/usr/bin/tini", "--", "python", "-m", "breb.entidad"]
    command: ["--analistas"]
    volumes: ["../datos:/datos:ro"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}

  # ---------------------------------------------------------------- Jobs de streaming (fase 4)
  # docker compose --profile streaming up -d   (antes: estado inicial en MongoDB, ver README)
  # Cada job corre su driver en este contenedor (modo cliente) y sus ejecutores en los workers.
  job1-bronze:
    <<: *job
    hostname: job1-bronze
    command: ["spark-submit", "--master", "spark://spark-master:7077",
              "--conf", "spark.driver.host=job1-bronze", "--conf", "spark.driver.bindAddress=0.0.0.0",
              "--conf", "spark.cores.max=${JOB1_NUCLEOS}", "--conf", "spark.executor.cores=${JOB1_NUCLEOS}",
              "--conf", "spark.executor.memory=512m", "--conf", "spark.sql.shuffle.partitions=${JOB1_NUCLEOS}",
              "--driver-memory", "512m", "/opt/breb/jobs/job1_bronze.py"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1g}

  job2-riesgo:
    <<: *job
    hostname: job2-riesgo
    depends_on:
      spark-master: {condition: service_started}
      init-recursos: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
      mongo-init: {condition: service_completed_successfully}
    command: ["spark-submit", "--master", "spark://spark-master:7077",
              "--conf", "spark.driver.host=job2-riesgo", "--conf", "spark.driver.bindAddress=0.0.0.0",
              "--conf", "spark.cores.max=${JOB2_NUCLEOS}", "--conf", "spark.executor.cores=${JOB2_NUCLEOS}",
              "--conf", "spark.executor.memory=1g", "--conf", "spark.sql.shuffle.partitions=${JOB2_NUCLEOS}",
              "--driver-memory", "1g", "/opt/breb/jobs/job2_riesgo.py"]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1792m}

  # Ventanas del RF3 en su propia aplicación, para que no ocupen los núcleos de las decisiones.
  job2-ventanas:
    <<: *job
    hostname: job2-ventanas
    command: ["spark-submit", "--master", "spark://spark-master:7077",
              "--conf", "spark.driver.host=job2-ventanas", "--conf", "spark.driver.bindAddress=0.0.0.0",
              "--conf", "spark.cores.max=${JOB2V_NUCLEOS}", "--conf", "spark.executor.cores=${JOB2V_NUCLEOS}",
              "--conf", "spark.executor.memory=768m", "--conf", "spark.sql.shuffle.partitions=${JOB2V_NUCLEOS}",
              "--driver-memory", "768m", "/opt/breb/jobs/job2_ventanas.py"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1280m}

  job3-silver:
    <<: *job
    hostname: job3-silver
    command: ["spark-submit", "--master", "spark://spark-master:7077",
              "--conf", "spark.driver.host=job3-silver", "--conf", "spark.driver.bindAddress=0.0.0.0",
              "--conf", "spark.cores.max=${JOB3_NUCLEOS}", "--conf", "spark.executor.cores=${JOB3_NUCLEOS}",
              "--conf", "spark.executor.memory=768m", "--conf", "spark.sql.shuffle.partitions=${JOB3_NUCLEOS}",
              "--driver-memory", "768m", "/opt/breb/jobs/job3_silver.py"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1280m}

  # Productor de la demo (fase 3): docker compose run --rm productor {preparar|publicar} ...
  # Lee y escribe en la carpeta datos/ del repositorio (ignorada por git).
  productor:
    image: breb-productor:local
    pull_policy: never
    build:
      context: ..
      dockerfile: infra/productor/Dockerfile
    profiles: [herramientas]
    restart: "no"
    depends_on:
      kafka-1: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
    volumes: ["../datos:/datos"]
    deploy:
      resources:
        # preparar lee el CSV completo (unos 4 GB); publicar usa menos de 1 GB.
        limits: {cpus: "1.5", memory: 6g}

  # ---------------------------------------------------------------- MongoDB (replica set rs0)
  # Genera una sola vez la llave interna del replica set en un volumen, con los permisos que exige mongod.
  mongo-llave:
    image: mongo:7.0.45
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ["[ -s /llave/keyfile ] || head -c 756 /dev/urandom | base64 -w 0 > /llave/keyfile; chmod 400 /llave/keyfile; chown mongodb:mongodb /llave/keyfile"]
    volumes: [mongo-llave:/llave]

  mongo-1:
    <<: *mongo
    hostname: mongo-1
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-1-datos:/data/db, "mongo-llave:/llave:ro"]

  mongo-2:
    <<: *mongo
    profiles: [completo]
    hostname: mongo-2
    volumes: [mongo-2-datos:/data/db, "mongo-llave:/llave:ro"]

  mongo-3:
    <<: *mongo
    profiles: [completo]
    hostname: mongo-3
    volumes: [mongo-3-datos:/data/db, "mongo-llave:/llave:ro"]

  # Comparte la red de mongo-1: por 127.0.0.1 aplica la "localhost exception" para crear el primer usuario.
  mongo-init:
    image: mongo:7.0.45
    restart: "no"
    network_mode: "service:mongo-1"
    depends_on:
      mongo-1: {condition: service_healthy}
      mongo-2: {condition: service_healthy, required: false}
      mongo-3: {condition: service_healthy, required: false}
    env_file: [credenciales/mongo-admin.env, credenciales/mongo-app.env]
    environment:
      MONGO_MIEMBROS: ${MONGO_MIEMBROS}
      HOME: /tmp
    volumes: ["./mongo/iniciar_replica.js:/scripts/iniciar_replica.js:ro"]
    entrypoint: ["mongosh", "--quiet", "mongodb://127.0.0.1:27017/?directConnection=true",
                 "--file", "/scripts/iniciar_replica.js"]

  # ---------------------------------------------------------------- Consumo: catálogo, SQL y tableros (RF11)
  # Perfil consumo: docker compose --profile consumo up -d
  postgres:
    image: postgres:15.19-bookworm
    profiles: [consumo]
    restart: unless-stopped
    env_file: [credenciales/postgres.env, credenciales/hms-db.env, credenciales/metabase-db.env]
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./postgres/iniciar_bases.sh:/docker-entrypoint-initdb.d/10-bases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 384m}

  hive-metastore:
    image: breb-hms:local
    pull_policy: never
    build:
      context: ..
      dockerfile: infra/hms/Dockerfile
    profiles: [consumo]
    restart: unless-stopped
    hostname: hive-metastore
    depends_on:
      postgres: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
    env_file: [credenciales/hms-db.env, credenciales/s3.env]
    environment:
      HMS_DB_URL: jdbc:postgresql://postgres:5432/metastore
      HMS_DB_USUARIO: metastore
      HMS_HEAP: 384m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9083"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768m}

  trino:
    image: trinodb/trino:484
    profiles: [consumo]
    restart: unless-stopped
    hostname: trino
    depends_on:
      hive-metastore: {condition: service_healthy}
    env_file: [credenciales/s3.env]
    volumes: ["./trino/etc:/etc/trino:ro"]
    # 8090 en el host: el 8080 es la interfaz del master de Spark.
    ports: ["127.0.0.1:8090:8080"]
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1536m}

  metabase:
    image: metabase/metabase:v0.65.3.6
    profiles: [consumo]
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      trino: {condition: service_healthy}
    env_file: [credenciales/metabase-db.env]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      # Con 1 GB de heap, la JVM de Metabase ocupa unos 1,46 GiB: el tope de 2 GiB deja margen.
      JAVA_OPTS: -Xmx1g
      MB_CHECK_FOR_UPDATES: "false"
      MB_ANON_TRACKING_ENABLED: "false"
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 2g}

  # ---------------------------------------------------------------- SNS y SQS locales (fase 6)
  moto:
    image: motoserver/moto:5.2.5
    restart: unless-stopped
    ports: ["127.0.0.1:5000:5000"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}

volumes:
  checkpoints:
  kafka-1-datos:
  kafka-2-datos:
  kafka-3-datos:
  seaweedfs-datos:
  mongo-llave:
  mongo-1-datos:
  mongo-2-datos:
  mongo-3-datos:
  postgres-datos:
