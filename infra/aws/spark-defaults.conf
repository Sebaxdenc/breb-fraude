# Modo AWS (infra/docker-compose.aws.yml): reemplaza a infra/spark/conf/spark-defaults.conf en los contenedores.
# Cambia solo S3 y el log de commits de Delta: S3 y DynamoDB reales. DefaultAWSCredentialsProviderChain toma
# primero las variables de entorno (plan B, en el portátil) y si no hay, el rol de la EC2. El resto es igual.

# Delta Lake
spark.sql.extensions                          io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog               org.apache.spark.sql.delta.catalog.DeltaCatalog

# Amazon S3 en us-east-1
spark.hadoop.fs.s3a.endpoint                  s3.us-east-1.amazonaws.com
spark.hadoop.fs.s3a.endpoint.region           us-east-1
spark.hadoop.fs.s3a.path.style.access         false
spark.hadoop.fs.s3a.connection.ssl.enabled    true
spark.hadoop.fs.s3a.aws.credentials.provider  com.amazonaws.auth.DefaultAWSCredentialsProviderChain
# Reintentos del SDK por cada reintento de S3A: con el valor por defecto de Hadoop 3.3.4 (20), un SeaweedFS
# caído tardaba 19 min en dar error. 5 es el valor por defecto de Hadoop 3.4.
spark.hadoop.fs.s3a.attempts.maximum          5

# Varios escritores por tabla (Job 3 y reprocess_quarantine en Silver): commits coordinados en DynamoDB
# (RNF-05, riesgo R9). Sin ddb.endpoint, el cliente usa el DynamoDB de la región.
spark.delta.logStore.s3a.impl                                     io.delta.storage.S3DynamoDBLogStore
spark.io.delta.storage.S3DynamoDBLogStore.ddb.tableName           delta_log
spark.io.delta.storage.S3DynamoDBLogStore.ddb.region              us-east-1
spark.io.delta.storage.S3DynamoDBLogStore.credentials.provider    com.amazonaws.auth.DefaultAWSCredentialsProviderChain

# Todas las marcas de tiempo en UTC (RF6) y conversión con Arrow entre Spark y pandas (Job 2)
spark.sql.session.timeZone                    UTC
spark.sql.execution.arrow.pyspark.enabled     true
spark.driver.extraJavaOptions                 -Duser.timezone=UTC
spark.executor.extraJavaOptions               -Duser.timezone=UTC

# Planificador FAIR con pools (fairscheduler.xml): en el Job 2, las decisiones tienen prioridad sobre las ventanas
spark.scheduler.mode                          FAIR
spark.scheduler.allocation.file               file:///opt/spark/conf/fairscheduler.xml

# Delta reconstruye el estado de la tabla en cada commit con 50 tareas por defecto; con tablas chicas y 1 o 2
# núcleos por job, eso dominaba el tiempo de cada escritura
spark.databricks.delta.snapshotPartitions     4

# Streaming con estado (ADR 02)
spark.sql.streaming.stateStore.providerClass  org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
