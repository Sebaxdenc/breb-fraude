# Modo AWS (infra/docker-compose.aws.yml): reemplaza a infra/trino/etc/catalog/lakehouse.properties.
# Amazon S3 en us-east-1. Sin llaves en el archivo: la cadena por defecto del SDK toma las variables de entorno
# (plan B, en el portátil) o el rol de la EC2.
connector.name=delta_lake
hive.metastore.uri=thrift://hive-metastore:9083
fs.native-s3.enabled=true
s3.region=us-east-1
# Spark escribe las tablas; Trino solo las registra (CALL lakehouse.system.register_table) y las lee.
delta.register-table-procedure.enabled=true
